# Local development only. In production the backend connects to your own
# on-prem Postgres server over VPN/SSH tunnel (see backend/.env.example) -
# this compose file is not used in production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: feedback_user
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: feedback_portal
    ports:
      # Published on 5442, not 5432: many dev machines already have a native
      # Postgres installed and listening on 5432 (services, pgAdmin, etc.) -
      # using a distinct port avoids silently colliding with or connecting to
      # the wrong instance.
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
