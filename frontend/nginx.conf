# TLS: terminate at your load balancer / reverse proxy, or use nginx.tls.conf.example.
# CSP connect-src must include the API origin when VITE_API_BASE_URL is set
# (cross-origin API), e.g. connect-src 'self' https://api.yourcompany.com
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 64k;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
